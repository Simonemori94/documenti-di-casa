<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>Documenti di casa</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --ink:#1b2430; --mute:#6b7787; --brand:#1f3a5f; --warn:#c0392b; --ok:#2e7d32; --line:#e2e7ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b212a; --ink:#e8edf3; --mute:#93a0b0; --brand:#5b8fd6; --line:#2a323d; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:70px; }
  header { background:var(--brand); color:#fff; padding:14px 16px; font-weight:600; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:14px; }
  main { max-width:760px; margin:0 auto; padding:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .mute { color:var(--mute); font-size:13px; }
  .badge { font-size:12px; padding:3px 8px; border-radius:20px; background:var(--line); white-space:nowrap; }
  .late { color:var(--warn); font-weight:600; } .soon { color:#d68910; font-weight:600; } .fine { color:var(--ok); }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); }
  nav button { flex:1; padding:14px 4px; border:0; background:none; color:var(--mute); font-size:14px; }
  nav button.on { color:var(--brand); font-weight:700; border-top:3px solid var(--brand); }
  input[type=text], input[type=password] { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:16px; }
  .btn { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:12px 16px; font-size:15px; }
  .btn.sec { background:var(--line); color:var(--ink); }
  .msg { padding:10px 12px; border-radius:12px; margin-bottom:8px; white-space:pre-wrap; line-height:1.4; }
  .msg.u { background:var(--brand); color:#fff; margin-left:40px; } .msg.a { background:var(--card); border:1px solid var(--line); margin-right:20px; }
  .hidden { display:none; } a { color:var(--brand); }
  #login { max-width:360px; margin:80px auto; padding:16px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; }
</style>
</head>
<body>
<div id="login" class="hidden">
  <h2>🏠 Documenti di casa</h2>
  <p class="mute">Inserisci la password dell'archivio.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <p><button class="btn" id="loginBtn" style="width:100%">Entra</button></p>
  <p id="loginErr" class="late"></p>
</div>

<div id="app" class="hidden">
  <header>🏠 Documenti di casa <span><button id="scanBtn">📷 Scansiona</button> <button id="uploadBtn">＋ Carica</button></span></header>
  <input type="file" id="fileIn" class="hidden" multiple accept=".pdf,image/*,.txt,.md">
  <input type="file" id="camIn" class="hidden" accept="image/*" capture="environment">
  <div id="scanPanel" class="hidden" style="position:fixed;inset:0;background:var(--bg);z-index:10;padding:16px;overflow:auto">
    <h3>📷 Scansione documento</h3>
    <p class="mute" id="scanInfo">Nessuna pagina. Inquadra il documento su una superficie piana, con buona luce.</p>
    <div id="thumbs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"></div>
    <div class="bar"><button class="btn" id="addPage">📷 Aggiungi pagina</button><button class="btn sec" id="undoPage">Rimuovi ultima</button></div>
    <div class="bar"><button class="btn" id="saveScan" style="flex:1">Salva documento</button><button class="btn sec" id="cancelScan">Annulla</button></div>
  </div>
  <main>
    <section id="tab-deadlines"></section>
    <section id="tab-docs" class="hidden">
      <div class="bar"><input type="text" id="q" placeholder="Cerca nei documenti…"></div>
      <div id="docList"></div>
    </section>
    <section id="tab-ask" class="hidden">
      <div id="chat"></div>
      <div class="bar"><input type="text" id="question" placeholder="Es. Quando scade l'assicurazione auto?"><button class="btn" id="askBtn">Invia</button></div>
    </section>
  </main>
  <nav>
    <button data-tab="deadlines" class="on">📅 Scadenze</button>
    <button data-tab="docs">📄 Documenti</button>
    <button data-tab="ask">💬 Assistente</button>
  </nav>
</div>

<script>
const $ = (s) => document.querySelector(s);
let pw = localStorage.getItem("dc_pw") || "";
let history = [];

async function api(path, opts = {}) {
  opts.headers = Object.assign({ Authorization: "Bearer " + pw }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) { showLogin(); throw new Error("401"); }
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Errore");
  return data;
}

function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
function showApp() { $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); loadDeadlines(); }

$("#loginBtn").onclick = async () => {
  pw = $("#pw").value;
  try { await api("/api/ping"); localStorage.setItem("dc_pw", pw); showApp(); }
  catch { $("#loginErr").textContent = "Password errata."; }
};

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  ["deadlines", "docs", "ask"].forEach((t) => $("#tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
  if (b.dataset.tab === "deadlines") loadDeadlines();
  if (b.dataset.tab === "docs") loadDocs();
});

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadDeadlines() {
  const list = await api("/api/deadlines");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (!list.length) { $("#tab-deadlines").innerHTML = '<p class="mute">Nessuna scadenza. Carica un documento per iniziare.</p>'; return; }
  $("#tab-deadlines").innerHTML = list.map((d) => {
    const days = Math.round((new Date(d.date) - today) / 86400000);
    const cls = days < 0 ? "late" : days <= 30 ? "soon" : "fine";
    const label = days < 0 ? `scaduta da ${-days} gg` : days === 0 ? "oggi" : `tra ${days} gg`;
    return `<div class="card"><div class="row"><div><b>${esc(d.description)}</b><div class="mute">${esc(d.title)}</div></div>
      <div style="text-align:right"><div>${new Date(d.date).toLocaleDateString("it-IT")}</div><div class="${cls}">${label}</div></div></div></div>`;
  }).join("");
}

async function loadDocs() {
  const q = encodeURIComponent($("#q").value.trim());
  const list = await api("/api/docs?q=" + q);
  $("#docList").innerHTML = list.length ? list.map((d) => `
    <div class="card"><div class="row"><b>${esc(d.title)}</b><span class="badge">${esc(d.category)}</span></div>
    <div class="mute" style="margin:6px 0">${esc(d.summary)}</div>
    <a href="/api/file/${d.id}?k=${encodeURIComponent(pw)}" target="_blank">Apri file</a> ·
    <a href="#" data-del="${d.id}" class="late">Elimina</a></div>`).join("") : '<p class="mute">Nessun documento trovato.</p>';
  document.querySelectorAll("[data-del]").forEach((a) => a.onclick = async (e) => {
    e.preventDefault();
    if (confirm("Eliminare questo documento?")) { await api("/api/docs/" + a.dataset.del, { method: "DELETE" }); loadDocs(); }
  });
}
let t; $("#q").oninput = () => { clearTimeout(t); t = setTimeout(loadDocs, 300); };

$("#uploadBtn").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = async (e) => {
  const files = [...e.target.files];
  for (const f of files) {
    $("#uploadBtn").textContent = "Analizzo " + f.name.slice(0, 12) + "…";
    const fd = new FormData(); fd.append("file", f);
    try { await api("/api/upload", { method: "POST", body: fd }); }
    catch (err) { alert("Errore con " + f.name + ": " + err.message); }
  }
  $("#uploadBtn").textContent = "＋ Carica"; e.target.value = "";
  loadDeadlines(); loadDocs();
};

// ---- Scansione con fotocamera: più foto -> un unico PDF ----
let scanPages = [];

async function photoToJpeg(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
  return { bytes: new Uint8Array(await blob.arrayBuffer()), w, h, url: URL.createObjectURL(blob) };
}

function buildPdf(pages) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = (x) => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (id, fn) => { offs[id] = len; push(id + " 0 obj\n"); fn(); push("\nendobj\n"); };
  const n = pages.length;
  push("%PDF-1.4\n");
  obj(1, () => push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2, () => push(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_, i) => (3 + 3 * i) + " 0 R").join(" ")}] >>`));
  pages.forEach((p, i) => {
    const W = 595, H = Math.round(595 * p.h / p.w), pid = 3 + 3 * i;
    obj(pid, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${pid + 2} 0 R >> >> /Contents ${pid + 1} 0 R >>`));
    const cs = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(pid + 1, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(pid + 2, () => {
      push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);
      push(p.bytes); push("\nendstream");
    });
  });
  const total = 3 + 3 * n, xref = len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let id = 1; id < total; id++) push(String(offs[id]).padStart(10, "0") + " 00000 n \n");
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: "application/pdf" });
}

function renderScan() {
  $("#thumbs").innerHTML = scanPages.map((p, i) => `<img src="${p.url}" style="height:110px;border-radius:8px;border:1px solid var(--line)" alt="pag ${i + 1}">`).join("");
  $("#scanInfo").textContent = scanPages.length ? scanPages.length + " pagina/e acquisita/e." : "Nessuna pagina. Inquadra il documento su una superficie piana, con buona luce.";
  $("#saveScan").disabled = !scanPages.length;
}
$("#scanBtn").onclick = () => { scanPages = []; renderScan(); $("#scanPanel").classList.remove("hidden"); $("#camIn").click(); };
$("#addPage").onclick = () => $("#camIn").click();
$("#camIn").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { scanPages.push(await photoToJpeg(f)); renderScan(); } catch { alert("Impossibile leggere la foto."); }
};
$("#undoPage").onclick = () => { scanPages.pop(); renderScan(); };
$("#cancelScan").onclick = () => { scanPages = []; $("#scanPanel").classList.add("hidden"); };
$("#saveScan").onclick = async () => {
  if (!scanPages.length) return;
  $("#saveScan").textContent = "Analizzo…"; $("#saveScan").disabled = true;
  const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
  const pdf = new File([buildPdf(scanPages)], "scansione-" + stamp + ".pdf", { type: "application/pdf" });
  const fd = new FormData(); fd.append("file", pdf);
  try { await api("/api/upload", { method: "POST", body: fd }); scanPages = []; $("#scanPanel").classList.add("hidden"); loadDeadlines(); loadDocs(); }
  catch (err) { alert("Errore: " + err.message); }
  $("#saveScan").textContent = "Salva documento"; renderScan();
};

function addMsg(role, text) {
  const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "u" : "a"); d.textContent = text;
  $("#chat").appendChild(d); d.scrollIntoView({ behavior: "smooth", block: "end" }); return d;
}
async function ask() {
  const question = $("#question").value.trim(); if (!question) return;
  $("#question").value = ""; addMsg("user", question);
  const wait = addMsg("assistant", "Cerco nei documenti…");
  try {
    const r = await api("/api/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question, history }) });
    wait.textContent = r.answer + (r.sources.length ? "\n\n📎 " + r.sources.map((s) => s.title).join(" · ") : "");
    history.push({ role: "user", text: question }, { role: "assistant", text: r.answer });
  } catch (err) { wait.textContent = "Errore: " + err.message; }
}
$("#askBtn").onclick = ask;
$("#question").onkeydown = (e) => { if (e.key === "Enter") ask(); };

if (pw) api("/api/ping").then(showApp).catch(showLogin); else showLogin();
</script>
</body>
</html>
