name = "documenti-di-casa"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "documenti-db"
database_id = "INCOLLA_QUI_L_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "documenti-files"
