name = "documenti-di-casa"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "documenti-db"
database_id = "d6c9c141-9240-4e16-a952-0b22d63ab8e4"

[[r2_buckets]]
binding = "FILES"
bucket_name = "documenti-files"
